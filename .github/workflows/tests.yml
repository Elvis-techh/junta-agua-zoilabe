# Run the checks CLAUDE.md asks for before pushing (typecheck, tests, and a
# build) on every pull request and every push to main, so each pull request
# page shows a green ✅ or a red ❌ before anyone merges it.
#
# The backend tests need no database server: each one makes its own SQLite
# database in memory, so there is nothing to start and no password anywhere.

name: Tests

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same pull request cancels the older, now pointless run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
